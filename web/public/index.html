<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kilobridge</title>
<meta name="description" content="Pay a Lightning invoice on another chain with your coins. Non-custodial: your payment is only collected once the invoice is paid.">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>
<main>
  <header>
    <div class="brand"><img src="coin.png" alt="" class="coin"><h1>Kilo<span>bridge</span></h1></div>
    <div class="tools">
      <button id="themeBtn" class="chip" aria-label="Theme">☾</button>
      <div class="lang"><button class="chip" data-lang="es">ES</button><button class="chip" data-lang="en">EN</button></div>
    </div>
  </header>
  <nav id="tabs" class="tabs" hidden>
    <a href="#" id="tabBridgeBtn" class="tab on">Kilobridge</a>
    <a href="#lsp" id="tabLspBtn" class="tab"></a>
    <a href="#kiloswap" id="tabSwapBtn" class="tab">Kiloswap</a>
  </nav>
  <div id="tabBridge">
  <p class="lead" data-t="lead"></p>

  <section id="prices" class="prices" hidden>
    <div class="pcard"><span class="plabel" id="pOwnUsdL"></span><strong id="pOwnUsd"></strong></div>
    <div class="pcard"><span class="plabel" id="pOwnShaL"></span><strong id="pOwnSha"></strong></div>
    <div class="pcard"><span class="plabel" id="pShaUsdL"></span><strong id="pShaUsd"></strong></div>
    <p class="pnote" data-t="pricesNote"></p>
  </section>

  <section id="step1" class="card">
    <label for="invoice" data-t="paste"></label>
    <textarea id="invoice" rows="5" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="lnbc… · name@domain · lnurl1…"></textarea>
    <div class="row">
      <button id="scanBtn" class="btn ghost"><svg class="icon-cam" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span data-t="scan"></span></button>
      <button id="pasteBtn" class="btn ghost" data-t="pasteBtn"></button>
    </div>
    <button id="checkBtn" class="btn primary wide" data-t="check"></button>
    <p id="err1" class="err" hidden></p>
  </section>

  <section id="stepAmt" class="card" hidden>
    <dl class="sum">
      <dt data-t="toL"></dt><dd id="amtTo" class="break"></dd>
      <dt data-t="dirL"></dt><dd id="amtDir"></dd>
    </dl>
    <p class="note" id="amtDesc"></p>
    <label for="amount" id="amtLabel" class="mt"></label>
    <input id="amount" class="field" inputmode="numeric" autocomplete="off" spellcheck="false">
    <p class="note" id="amtRange"></p>
    <div id="commentBox" hidden>
      <label for="comment" data-t="commentL" class="mt"></label>
      <input id="comment" class="field" autocomplete="off">
    </div>
    <div class="row">
      <button id="amtBack" class="btn ghost" data-t="back"></button>
      <button id="amtBtn" class="btn primary" data-t="amtNext"></button>
    </div>
    <p id="errAmt" class="err" hidden></p>
  </section>

  <section id="step2" class="card" hidden>
    <dl class="sum">
      <dt id="sumDestL" data-t="toL" hidden></dt><dd id="sumDest" class="break" hidden></dd>
      <dt data-t="dirL"></dt><dd id="sumDir"></dd>
      <dt data-t="youSend"></dt><dd id="sumSat"></dd>
      <dt data-t="youPay"></dt><dd id="sumPay" class="hi"></dd>
      <dt data-t="price"></dt><dd id="sumRate"></dd>
      <dt data-t="fee"></dt><dd id="sumFee"></dd>
    </dl>
    <p class="note" data-t="estimateNote"></p>
    <div class="row">
      <button id="backBtn" class="btn ghost" data-t="back"></button>
      <button id="quoteBtn" class="btn primary" data-t="getInvoice"></button>
    </div>
    <p id="err2" class="err" hidden></p>
  </section>

  <section id="step3" class="card" hidden>
    <p class="big"><span data-t="payExactly"></span> <strong id="paySat"></strong> <span data-t="ownUnit"></span></p>
    <p class="timer"><span data-t="expiresIn"></span> <strong id="countdown">1:00</strong></p>
    <a id="qrLink" class="qr" href="#"><img id="qr" alt="QR"></a>
    <div class="row">
      <button id="copyBtn" class="btn ghost" data-t="copy"></button>
      <a id="openBtn" class="btn primary" href="#" data-t="open"></a>
    </div>
    <p class="status" id="status"></p>
    <p class="note" data-t="holdNote"></p>
  </section>

  <section id="step4" class="card" hidden>
    <p class="big" id="doneTitle"></p>
    <p id="doneText"></p>
    <div id="proof" hidden>
      <p class="note" data-t="proof"></p>
      <code id="preimage"></code>
    </div>
    <button id="againBtn" class="btn primary wide" data-t="again"></button>
  </section>

  <section class="how">
    <h2 data-t="howTitle"></h2>
    <ol>
      <li data-t="how1"></li>
      <li data-t="how2"></li>
      <li data-t="how3"></li>
    </ol>
    <p class="note" id="limitsNote"></p>
  </section>

  <section class="how own">
    <h2 data-t="ownTitle"></h2>
    <p data-t="own1"></p>
    <p data-t="own2"></p>
    <ul>
      <li><strong data-t="ownUseT"></strong> <span data-t="ownUse"></span></li>
      <li><strong data-t="ownRunT"></strong> <span data-t="ownRun"></span></li>
    </ul>
    <a class="btn ghost wide" href="https://github.com/Kilombino/kilobridge#run-your-own-bridge" rel="noreferrer" data-t="ownBtn"></a>
  </section>

  <section class="how own api">
    <h2 data-t="apiTitle"></h2>
    <p data-t="api1"></p>
    <ul>
      <li><code>GET /api/info</code> · <span data-t="apiInfo"></span></li>
      <li><code>GET /api/pow</code> · <span data-t="apiPow"></span></li>
      <li><code>POST /api/lnurl</code> · <span data-t="apiLnurl"></span></li>
      <li><code>POST /api/check</code> · <span data-t="apiCheck"></span></li>
      <li><code>POST /api/quote</code> · <span data-t="apiQuote"></span></li>
      <li><code>GET /api/swap/&lt;hash&gt;?t=&lt;token&gt;</code> · <span data-t="apiSwap"></span></li>
    </ul>
    <p data-t="apiCors"></p>
    <p><span data-t="apiOnion"></span><br><code class="mono break">http://li7nwmrffmt6iut2ygolrs6mgrzwdxe26mtatzpgxvff3fri3rnq4iid.onion</code></p>
    <p class="note" data-t="apiLimits"></p>
  </section>
  </div>

  <div id="tabSwap" hidden>
    <p class="lead" id="swapLead"></p>
    <section class="prices lspfacts">
      <div class="pcard"><span class="plabel" id="swapInL"></span><strong id="swapIn"></strong></div>
      <div class="pcard"><span class="plabel" id="swapOutL"></span><strong id="swapOut"></strong></div>
      <div class="pcard"><span class="plabel" id="swapLimL"></span><strong id="swapLim"></strong></div>
    </section>
    <section class="card">
      <a id="swapOpen" class="btn primary wide" href="https://swap.kilombino.com" target="_blank" rel="noopener"></a>
      <p class="note mt" id="swapNote"></p>
    </section>
  </div>

  <div id="tabLsp" hidden>
    <p class="lead" id="lspLead"></p>
    <section class="prices lspfacts">
      <div class="pcard"><span class="plabel" id="lspFeeL"></span><strong id="lspFee"></strong></div>
      <div class="pcard"><span class="plabel" id="lspAvailL"></span><strong id="lspAvail"></strong></div>
      <div class="pcard"><span class="plabel" id="lspDaysL"></span><strong id="lspDays"></strong></div>
    </section>

    <section id="lsp1" class="card">
      <label for="lspPubkey" id="lspPubkeyL"></label>
      <input id="lspPubkey" class="field mono" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="02…@host:9735">
      <label for="lspSize" id="lspSizeL" class="mt"></label>
      <select id="lspSize" class="field"></select>
      <dl class="sum mt"><dt id="lspPayL"></dt><dd id="lspPay" class="hi"></dd></dl>
      <button id="lspPrepBtn" class="btn primary wide"></button>
      <p id="lspErr1" class="err" hidden></p>
    </section>

    <section id="lsp3" class="card" hidden>
      <p class="big"><span id="lspPayNowL"></span> <strong id="lspPayNow"></strong></p>
      <p class="timer"><span id="lspInvLeftL"></span> <strong id="lspInvLeft">10:00</strong></p>
      <a id="lspQrLink" class="qr" href="#"><img id="lspQr" alt="QR"></a>
      <div class="row">
        <button id="lspCopyInv" class="btn ghost"></button>
        <a id="lspOpenInv" class="btn primary" href="#"></a>
      </div>
      <p class="status" id="lspStatus"></p>
      <p class="note" id="lspHoldNote"></p>
    </section>

    <section id="lsp4" class="card" hidden>
      <p class="big" id="lspDoneT"></p>
      <p id="lspDoneText"></p>
      <button id="lspAgain" class="btn primary wide"></button>
    </section>

    <section class="how">
      <h2 id="lspHowT"></h2>
      <ol><li id="lspHow1"></li><li id="lspHow2"></li><li id="lspHow3"></li><li id="lspHow4"></li></ol>
      <p class="note" id="lspRules"></p>
    </section>
  </div>
  <footer><span data-t="footer"></span> · <a href="https://github.com/paulscode/lightning-fork" rel="noreferrer">Lightning Fork</a></footer>
</main>

<div id="scanner" class="scanner" hidden>
  <div class="scanbox">
    <video id="video" playsinline muted></video>
    <div class="frame"></div>
    <p class="note" id="scanMsg" data-t="scanHint"></p>
    <button id="scanClose" class="btn ghost wide" data-t="close"></button>
  </div>
</div>
<canvas id="canvas" hidden></canvas>
<script src="qrcode.js"></script>
<script src="jsqr.js"></script>
<script src="app.js?v=5"></script>
<script src="lsp.js?v=4"></script>
<script src="kiloswap.js?v=1"></script>
</body>
</html>
